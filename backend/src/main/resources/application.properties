spring.application.name=pokedex-api
server.port=8080

# A URI do MongoDB (com usuário/senha do Atlas) vem de variável de ambiente e
# NUNCA deve ser commitada. Sem a variável, usa um MongoDB local.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pokedex}

# Origens liberadas no CORS (separadas por vírgula)
pokedex.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
